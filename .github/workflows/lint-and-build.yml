name: Lint and Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile
      - name: Run ESLint
        run: yarn lint
      - name: Check file names
        run: yarn check-names
      - name: Run TypeScript type checking
        run: yarn typecheck
      - name: Build Next.js and Electron source
        run: yarn build:ci
