name: Lint and Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile
      - name: Verify
        run: yarn verify
